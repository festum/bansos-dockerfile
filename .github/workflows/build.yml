name: Build upstream image

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-image-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream default branch and commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --symref https://github.com/ihsan-ramadhan/bansos-router.git HEAD)"
          branch="$(awk '$1 == "ref:" && $3 == "HEAD" { print $2 }' <<< "$remote")"
          sha="$(awk '$2 == "HEAD" && $1 ~ /^[0-9a-f]{40}$/ { print $1 }' <<< "$remote")"
          if [[ ! "$branch" =~ ^refs/heads/.+ ]] || [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not parse upstream default branch and full commit SHA from git ls-remote output" >&2
            exit 1
          fi
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"
          printf 'Upstream default branch: %s\nUpstream commit: %s\n' "$branch" "$sha"

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: ihsan-ramadhan/bansos-router
          ref: ${{ steps.upstream.outputs.sha }}
          path: upstream
          persist-credentials: false

      - name: Check whether commit image has both platforms
        id: existing
        shell: bash
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --write-out $'\n%{http_code}' \
            "https://hub.docker.com/v2/repositories/festum/bansos/tags/sha-${SHA}")"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          case "$status" in
            200|404) ;;
            *) echo "Unexpected Docker Hub tag lookup HTTP status: $status" >&2; exit 1 ;;
          esac
          if [[ "$status" == 404 ]]; then
            state=rebuild
          else
            if ! jq -e 'type == "object" and (.images | type == "array" and length > 0 and all(.[]; type == "object" and (.os | type == "string") and (.architecture | type == "string")))' <<< "$body" >/dev/null; then
              echo "Docker Hub tag response has invalid or missing image platform data" >&2
              exit 1
            fi
            if jq -e '([.images[] | select(.os == "linux" and .architecture == "amd64")] | length > 0) and ([.images[] | select(.os == "linux" and .architecture == "arm64")] | length > 0)' <<< "$body" >/dev/null; then
              state=complete
            else
              state=rebuild
            fi
          fi
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" == complete ]]; then
            echo "Image for upstream commit ${SHA} already includes linux/amd64 and linux/arm64; skipping build and push."
          else
            echo "Image for upstream commit ${SHA} needs a multi-platform build."
          fi

      - name: Set up QEMU
        if: steps.existing.outputs.state != 'complete'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.existing.outputs.state != 'complete'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.existing.outputs.state != 'complete'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.existing.outputs.state != 'complete'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            festum/bansos:latest
            festum/bansos:sha-${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.source=https://github.com/ihsan-ramadhan/bansos-router
